# gitleaks configuration, used by .github/workflows/secret-scan.yml and usable as a
# pre-commit hook (see docs/TEMPLATE-SETUP.md).
#
# Extends the gitleaks default ruleset (>150 patterns: cloud API keys, JWTs,
# private keys, generic password assignments, ...) plus entropy detection for
# unknown secrets.

[extend]
useDefault = true

# Add project-specific rules or allowlists below. Keep allowlists as narrow as
# possible (a single path or a single fingerprint), never a whole directory of
# code. Example for a file of deliberately fake test credentials:
#
# [allowlist]
# description = "Fake credentials used by the unit tests"
# paths = [
#   '''^tests/fixtures/fake-credentials\.txt$''',
# ]

# The sample token of jwt.io (header {"alg":"HS256","typ":"JWT"}, payload {"sub":"1234567890","name":"John Doe",
# "iat":1516239022}, signed with the published secret "your-256-bit-secret"): the long unbroken string of the
# Textarea visual and reflow tests (#149). Public documentation data, not a credential; this one value only.
[[allowlists]]
description = "jwt.io sample token (Textarea tests)"
regexTarget = "match"
regexes = [
  '''eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9\.eyJzdWIiOiIxMjM0NTY3ODkwIiwibmFtZSI6IkpvaG4gRG9lIiwiaWF0IjoxNTE2MjM5MDIyfQ\.SflKxwRJSMeKKF2QT4fwpMeJf36POk6yJV_adQssw5c''',
]
