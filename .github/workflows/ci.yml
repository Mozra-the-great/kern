name: CI

# Stack-neutral skeleton. The job id `build` is the stable name of the required
# status check: keep it, and add your stack's steps below by uncommenting ONE of
# the marked blocks (or adding your own). Delete the blocks you do not need.
#
# `build` must pass on every PR, so this workflow has NO workflow-level `paths:`
# filter (convention C1): a required check whose workflow does not start is
# reported as pending forever, not as skipped. If a step should only run for
# some files, put the condition on the step or job, not on the trigger.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # Public repo: hosted runner, free. Private repo: see docs/TEMPLATE-SETUP.md
    # (decision D1) before you rely on this - hosted minutes may be exhausted, and
    # a required check that cannot start blocks every PR (convention C4).
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # ── Labels-as-code tests (opt-in set, see .github/labels.json) ────────────
      # Runs only while the set is present, so deleting scripts/ci/ needs no edit
      # here. Standard library only: the runner's python3 is enough.
      - name: Test label script
        if: ${{ hashFiles('scripts/ci/test_labels.py') != '' }}
        run: python3 -m unittest discover -s scripts/ci -p "test_*.py"

      # ── Stack: Node (Svelte 5 kit) ────────────────────────────────────────────
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Install
        # npm ci, not npm install: it installs the lockfile exactly and fails if
        # package.json and the lockfile disagree, so a green build means something.
        run: npm ci
      - name: Type check
        run: npm run check
      - name: Lint (ESLint + Prettier)
        run: npm run lint
      - name: No markup from strings ({@html}, innerHTML, ... in src/lib and src/elements)
        # The kit renders text as text nodes; a consumer can pass untrusted text without a sanitizer (#59).
        run: npm run check:html
      - name: Brand-art drift (assets/* against their manifests, the Code catalogue and the SVG rules)
        # The manifests are the contract with the art sources; refresh: assets/README.md.
        run: npm run assets:check
      - name: Code theme source (brands/code.css generated from code.tokens.json, values against the design snapshot)
        # The snapshot is the contract with stuffcloud's docs/design; refresh: docs/themes.md, "Code theme source".
        run: npm run tokens:check
      - name: Instance neutrality (no operator domains, names or addresses in themes and brand art)
        # Generic patterns always; KERN_FORBIDDEN_TERMS (Actions secret or variable, never in the repo) adds the
        # operator's own list. Forks and Dependabot get no secrets: then only the generic check runs.
        env:
          KERN_FORBIDDEN_TERMS: ${{ secrets.KERN_FORBIDDEN_TERMS || vars.KERN_FORBIDDEN_TERMS }}
        run: npm run neutrality:check
      - name: Build
        # svelte-package (dist/), custom elements (dist-elements/ + typings), demo (demo-dist/)
        run: npm run build
      - name: Strict consumer type check (consumer-typecheck)
        # A Svelte app with stuffcloud's flags (exactOptionalPropertyTypes, noUncheckedIndexedAccess,
        # svelte-check --fail-on-warnings ...) using every component from the built dist/ (#22).
        run: npm run test:consumer
      - name: No any in published types
        run: npm run check:dts
      - name: Tests (Vitest, node + dom projects with coverage)
        # The same run as `npm test`, with the v8 coverage of src/lib: the table is printed here and the
        # thresholds in vitest.config.ts are the ratchet (they fail the step when coverage drops, #24).
        run: npm run test:coverage
      - name: Upload coverage report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: coverage/
          if-no-files-found: ignore
          retention-days: 14
      - name: Custom Elements Manifest is up to date
        # The build regenerates custom-elements.json from src/elements; commit the result.
        run: git diff --exit-code custom-elements.json
      - name: Element typings (strict TS + React 19 fixture)
        run: npm run test:types
      - name: Size budget (custom elements)
        run: npm run size
      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium
      - name: Touch targets (Playwright, built demo)
        run: npm run test:targets
      - name: Element tests (Playwright, built dist-elements/)
        # Includes the visual regression of the Code theme (tests/elements/visual.spec.ts, Linux baselines).
        run: npm run test:elements
      - name: Upload the actual screenshots of a failed visual test
        # The way to new Linux baselines: `gh run download <run> -n visual-results -D <dir>`, then
        # `node scripts/ci/visual-baselines.mjs <dir>`; review every image before committing (docs/themes.md).
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: visual-results
          path: |
            tests/elements/test-results/
            tests/elements/visual.spec.ts-snapshots/*-linux.png
          if-no-files-found: ignore
          retention-days: 14
      - name: Mascot runtime (Playwright, built k-mascot under a strict CSP)
        run: npm run test:mascot

      # ── Node 24 (current LTS) ─────────────────────────────────────────────────
      # Same job on purpose: the required check `build` then means "green on Node 22
      # and 24" and keeps its name (a matrix would rename it to `build (22)` ...).
      # `npm ci` wipes node_modules and builds dist/ again via `prepare`.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Install (Node 24)
        run: npm ci
      - name: Type check (Node 24)
        run: npm run check
      - name: Build (Node 24)
        run: npm run build
      - name: Unit tests (Node 24)
        run: npm test

      # ── Svelte range: lowest supported and newest 5.x ─────────────────────────
      # peerDependencies.svelte is the lowest version the components compile on
      # ($props.id() arrived in 5.20.0). --no-save keeps package-lock.json as is;
      # --legacy-peer-deps because the build plugin wants a newer Svelte than the
      # one under test. Each step builds the package and the custom elements and
      # compiles every published component for browser and SSR.
      - name: Svelte lowest (5.20.0)
        # Deliberately outside the lockfile: that is the point of this step.
        run: | # zizmor: ignore[adhoc-packages]
          npm install --ignore-scripts --no-save --legacy-peer-deps svelte@5.20.0
          npm run package
          npm run build:elements
          node scripts/ci/compile-dist.mjs
      - name: Svelte newest 5.x
        run: | # zizmor: ignore[adhoc-packages]
          npm install --ignore-scripts --no-save --legacy-peer-deps 'svelte@^5'
          npm run package
          npm run build:elements
          node scripts/ci/compile-dist.mjs
