name: CodeQL

# Advanced setup instead of GitHub's default setup: the default setup picks its
# languages from the repo's language statistics, which list only Python here
# (Svelte files are not counted as TypeScript), so the actual kit code was not
# scanned. The languages are fixed below instead.
#
# The required status check is `CodeQL` (code-scanning result, reported by
# GitHub Advanced Security, integration 57789), not the job names below. It is
# required, so this workflow has no `paths:` filter (convention C1).
# CodeQL does not parse `.svelte` files; it scans the `.ts`/`.js`/`.html` sources,
# the workflows and the Python label scripts.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '27 4 * * 1'
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    # One job for all languages, not a matrix: the required `CodeQL` result check is
    # decided when the first upload of a commit arrives. With one job per language the
    # first upload (python) came alone, the check saw the other configurations as
    # missing and ended neutral, which a ruleset counts as passing. Uploading all
    # three together keeps the check meaningful. Categories stay /language:<lang>.
    name: Analyze
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
      security-events: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: actions, javascript-typescript, python
          build-mode: none
          queries: security-extended

      - name: Analyze
        uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
