name: Release

# Pushing a tag `vX.Y.Z` builds ONE tarball (`npm pack`) and attaches it, with its
# checksums, to a GitHub release. Consumers install that tarball by URL; npm and
# pnpm record its integrity hash in the lock file, so no registry token is needed.
# See "Installation und Pinning" in README.md.
#
# Not a required check and no `paths:` filter needed: it only runs on tags. The
# job refuses a tag that does not match package.json or is not on main, so a
# stray tag cannot produce a release. `contents: write` is granted on the job
# only, the workflow default stays read-only.

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history: the next step checks that the tagged commit is on main.
          fetch-depth: 0
          persist-credentials: false

      - name: Verify tag
        env:
          TAG: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Tag '$TAG' is not vMAJOR.MINOR.PATCH[-prerelease]"
            exit 1
          fi
          version="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "v${version}" ]; then
            echo "::error::Tag $TAG does not match package.json version ${version}"
            exit 1
          fi
          if ! git merge-base --is-ancestor "$SHA" origin/main; then
            echo "::error::Tagged commit $SHA is not on main"
            exit 1
          fi
          if ! grep -q "^## \[${version}\]" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no section for ${version}"
            exit 1
          fi

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          # Release artefact: never restore a shared cache into it (cache poisoning).
          package-manager-cache: false

      - name: Install
        run: npm ci

      - name: Type check
        run: npm run check

      - name: Build
        run: npm run build

      - name: Pack tarball and checksums
        run: |
          set -euo pipefail
          # dist/ and dist-elements/ were just built by `npm run build`.
          npm pack --ignore-scripts
          version="$(node -p "require('./package.json').version")"
          tarball="mozra-the-great-kern-${version}.tgz"
          test -f "$tarball"
          # The tarball must carry the files consumers rely on.
          listing="$(tar -tzf "$tarball")"
          for f in package/package.json package/LICENSE package/NOTICE package/README.md \
                   package/CHANGELOG.md package/dist/index.js package/dist/themes/index.css \
                   package/dist/themes/code.css package/dist/themes/stuffcloud.css \
                   package/dist-elements/kern-elements.js \
                   package/assets/code/logo/logo.svg package/assets/pop/logo/logo.svg \
                   package/assets/line/logo/mark-ink.svg package/assets/flower/trees/olive-tree.svg; do
            grep -qxF "$f" <<<"$listing" || { echo "::error::$f missing from $tarball"; exit 1; }
          done
          sha256sum "$tarball" > "${tarball}.sha256"
          sha512sum "$tarball" > "${tarball}.sha512"
          echo "TARBALL=${tarball}" >> "$GITHUB_ENV"
          echo "VERSION=${version}" >> "$GITHUB_ENV"
          cat "${tarball}.sha256" "${tarball}.sha512"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # Release notes = the CHANGELOG section of this version, plus the integrity
          # string npm and pnpm write to the lock file (sha512, base64, "SRI").
          awk -v v="[${VERSION}]" '/^## \[/ { p = (index($0, v) > 0); next } p' CHANGELOG.md > notes.md
          if ! [ -s notes.md ]; then
            echo "::error::Empty CHANGELOG section for ${VERSION}"
            exit 1
          fi
          integrity="sha512-$(openssl dgst -sha512 -binary "$TARBALL" | openssl base64 -A)"
          {
            echo
            echo "### Integrity"
            echo
            echo '```'
            echo "$integrity"
            cat "${TARBALL}.sha256"
            echo '```'
          } >> notes.md
          flags=()
          if [[ "$TAG" == *-* ]]; then flags+=(--prerelease); fi
          gh release create "$TAG" \
            "$TARBALL" "${TARBALL}.sha256" "${TARBALL}.sha512" \
            --verify-tag \
            --title "$TAG" \
            --notes-file notes.md \
            "${flags[@]}"
