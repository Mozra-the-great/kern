version: 2

# Dependabot keeps the SHA-pinned actions in .github/workflows fresh (convention C5)
# and, once you uncomment a block below, the dependencies of your stack.
#
# cooldown (zizmor audit dependabot-cooldown): a new release is proposed only after
# 7 days. If a package is compromised that is usually noticed within that window;
# without the wait the bad version would sit in a PR immediately. Every ecosystem
# needs its own cooldown entry, so copy it into each block you enable.
#
# Cost: Dependabot runs as GitHub Actions jobs - free in a public repo, billed
# against the Actions minutes in a private one (see docs/TEMPLATE-SETUP.md, D1).
# Dependabot cannot read repository secrets, so Claude jobs skip its PRs
# (`github.actor != 'dependabot[bot]'`). Merge its PRs only after `build` ran on them.
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore(actions)"

  # Node (package.json + package-lock.json in the repo root). Dev dependencies
  # only; svelte is also a peer dependency (^5), so minor/patch bumps are grouped.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore(deps)"
    groups:
      # vite and the Svelte plugin pin each other's majors (plugin 7 needs vite 8
      # and vice versa), so separate PRs could never install. Listed first: a
      # dependency joins the first group that matches.
      vite:
        patterns: ["vite", "@sveltejs/vite-plugin-svelte"]
      dev-minor-patch:
        update-types: ["minor", "patch"]
    ignore:
      # svelte-check 4.x accepts typescript ^5 || ^6 only; TypeScript 7 (native
      # compiler) cannot install until svelte-check supports it. Drop this entry then.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
